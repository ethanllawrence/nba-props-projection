# Daily board: pull tonight's slate and game logs from ESPN, project, and
# commit the refreshed docs/data/*.json so GitHub Pages serves them.
#
# Runs three times a day, Arizona time: 6 AM (adds last night's box scores
# to history/, buys odds, settles last night), 3 PM (picks up injury news),
# and 8 PM (flips the board to tomorrow's slate, projections only; lines come
# the next morning). Every run retrains the PRA model on history/ (~1 min).
# Offseason runs only refresh a small heartbeat file.
#
# Odds: only the 6 AM run buys prop lines (The Odds API, shared free plan,
# rationed in nproj/ingest/odds.py), as early as possible because the
# backtest found the model's edge is against early lines. The 3 PM run
# reuses them for free.
# Every run prints the credit balance, which is a free call.
#
# Test run: Actions tab -> "Daily board" -> Run workflow, and enter a past
# date like 2026-03-10. Test runs print what the board WOULD show and never
# commit, so the live site stays as it is.

name: Daily board

on:
  schedule:
    - cron: "0 13 * * *"   # 6:00 AM Arizona (UTC-7, no daylight saving)
    - cron: "0 22 * * *"   # 3:00 PM Arizona
    - cron: "0 3 * * *"    # 8:00 PM Arizona: board flips to tomorrow
  workflow_dispatch:
    inputs:
      date:
        description: "Test date YYYY-MM-DD (leave blank for a real run that updates the site)"
        required: false
        default: ""
      odds:
        description: "Real runs only: also buy today's prop lines (spends credits)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-board
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline tests (fake ESPN data + real ESPN samples)
        run: |
          python tests/test_pipeline_offline.py
          python tests/test_history_parsers.py
          python tests/test_model_live.py
          python tests/test_injury_check.py

      - name: Odds API credits (free call)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m nproj odds-status || echo "odds-status failed; the board still runs"

      - name: Run the pipeline
        env:
          TEST_DATE: ${{ github.event.inputs.date }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # props on the 6 AM scheduled run, or a manual real run with the box ticked
          NPROJ_ODDS_MODE: ${{ (github.event.schedule == '0 13 * * *' || (github.event.inputs.odds == 'true' && github.event.inputs.date == '')) && 'props' || 'off' }}
          # Share of spare credits NBA may use; the rest is left for the K Board.
          # Set a repo variable NPROJ_ODDS_SHARE (e.g. 0.8) once MLB is done.
          NPROJ_ODDS_SHARE: ${{ vars.NPROJ_ODDS_SHARE || '0.5' }}
        run: |
          if [ -n "$TEST_DATE" ]; then
            python -m nproj daily --date "$TEST_DATE"
          else
            python -m nproj daily
          fi

      - name: Show the board, then commit (real runs only)
        env:
          TEST_DATE: ${{ github.event.inputs.date }}
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("docs/data/today.json"))
          if d.get("unmatched_lines"):
              print("WARNING unmatched sportsbook names:", ", ".join(d["unmatched_lines"]))
          print(f"Board for {d['date']} ({d.get('model', 'baseline')}): {len(d['players'])} players")
          for p in d["players"][:25]:
              s = p["stats"]
              pra = (s.get("pra") or {}).get("proj") or sum(s[k]["proj"] for k in ("points", "rebounds", "assists"))
              calls = [f"{k} {v['call']}" for k, v in s.items() if v.get("call")]
              print(f"  {p['player']:<28} {p['team']:>3} {'vs' if p['home'] else ' @'} {p['opp']:<3}"
                    f"  {s['points']['proj']:5.1f} pts {s['rebounds']['proj']:5.1f} reb"
                    f" {s['assists']['proj']:5.1f} ast  PRA {pra:5.1f}"
                    f"  {p.get('minutes') or 0:4.1f} min  {' '.join(calls)}")
          j = json.load(open("docs/data/jokic.json"))
          print("Jokic:", j["season_summary"], "| call:", j["tonight"].get("call"),
                j["tonight"].get("td_projection", {}).get("model_prob"))
          EOF
          if [ -n "$TEST_DATE" ]; then
            echo "Test run for $TEST_DATE: not committing."
            exit 0
          fi
          git add docs/data history    # site data + new box scores (incl. new files)
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily board $(TZ=America/Phoenix date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
