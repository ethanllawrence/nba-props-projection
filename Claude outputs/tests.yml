# Tests on every code push, so a broken change shows a red X right away
# instead of failing the next scheduled Daily board run. Data-only commits
# (the bots' board updates) don't trigger it.

name: Tests

on:
  push:
    branches: [main]
    paths:
      - "nproj/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline tests (same as the Daily board run)
        run: |
          python tests/test_pipeline_offline.py
          python tests/test_history_parsers.py
          python tests/test_model_live.py
          python tests/test_injury_check.py
