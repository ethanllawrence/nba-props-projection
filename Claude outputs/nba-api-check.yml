# Manual connectivity test: can a GitHub-hosted runner reach stats.nba.com?
#
# Run it from the repo's Actions tab -> "NBA API check" -> "Run workflow".
# It changes nothing in the repo; it only prints what it got back.
#
# Why this exists: the Cowork cloud sandbox can't reach stats.nba.com (proxy
# 403), so the plan is to run real ingest from GitHub Actions. stats.nba.com is
# known to throttle or silently drop requests from cloud IP ranges, so this
# checks that assumption before building the daily pipeline on top of it.

name: NBA API check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # nba_stats retries 4x at 60s each, so a stalled host takes a while to fail
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Call stats.nba.com through nproj's real ingest code
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'EOF'
          import time
          from nproj.ingest import nba_stats

          JOKIC_ID = "203999"
          checks = {
              "Jokic 2025-26 game log": lambda: nba_stats.fetch_player_game_log(JOKIC_ID, "2025-26"),
              "Denver roster": lambda: nba_stats.fetch_rosters(team_id=1610612743),
          }
          failed = 0
          for label, fn in checks.items():
              t0 = time.time()
              try:
                  rows = fn()
                  print(f"PASS  {label}: {len(rows)} rows in {time.time() - t0:.1f}s")
                  if rows:
                      print(f"      sample: {rows[0]}")
              except Exception as exc:
                  failed += 1
                  print(f"FAIL  {label} after {time.time() - t0:.1f}s: {type(exc).__name__}: {exc}")
          raise SystemExit(1 if failed else 0)
          EOF
